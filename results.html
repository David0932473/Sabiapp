<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sabi - Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="results.css">
    <link rel="stylesheet" href="review.css">
</head>
<body>
    <header class="results-header">
        <h2>SABI ANALYTICS</h2>
        <button class="home-btn" onclick="window.location.href='index.html'">HOME</button>
    </header>

    <main class="dashboard-container">
        <div class="score-card">
            <h3 class="score-title">UTME TOTAL SCORE</h3>
            <div class="score-display">
                <span class="score-number" id="total-score">0</span>
                <span class="score-max">/ 400</span>
            </div>
            <div class="badge-box" id="badge-box">
                <span class="badge-icon" id="badge-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"></circle><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"></path></svg></span>
                <span class="badge-text" id="badge-text">Calculating...</span>
            </div>
            <p class="sabi-advice" id="sabi-advice">Analyzing your performance...</p>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <span class="stat-label">TIME SPENT</span>
                <span class="stat-value" id="time-spent">00:00</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">ACCURACY</span>
                <span class="stat-value" id="accuracy-percent">0%</span>
            </div>
        </div>

        <h3 class="section-title">SUBJECT BREAKDOWN</h3>
        <div class="breakdown-grid" id="breakdown-grid">
            </div>

<button class="review-btn" onclick="window.location.href='review.html'">
    <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span> CHECK CORRECTIONS
</button>


            <button class="action-btn primary" onclick="retakeExam()">RETAKE EXAM</button>
        </div>
    </main>

    <script src="results.js"></script>
</body>
</html>
